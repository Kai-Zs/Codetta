<h2>斜向运动图案 — 三种风格</h2>
<p class="subtitle">图案沿对角线方向匀速移动，年轻现代感</p>

<div class="cards">
  <div class="card" data-choice="a" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="width:100%;aspect-ratio:4/3;background:#faf8ff;border-radius:8px;overflow:hidden;position:relative;">
        <svg viewBox="0 0 300 225" style="width:100%;height:100%;position:absolute;">
          <defs>
            <pattern id="de1" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <line x1="0" y1="12" x2="24" y2="12" stroke="rgba(124,58,237,0.08)" stroke-width="1"/>
              <circle cx="12" cy="12" r="2.5" fill="rgba(124,58,237,0.15)"/>
            </pattern>
          </defs>
          <rect width="300" height="225" fill="url(#de1)"/>
        </svg>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50%;aspect-ratio:9/16;background:white;border-radius:10px;box-shadow:0 4px 24px rgba(124,58,237,0.08);display:flex;align-items:center;justify-content:center;font-size:10px;color:#333;border:1px solid rgba(0,0,0,0.04);">练笔小筑</div>
      </div>
    </div>
    <div class="card-body"><h3>A — 斜向点线</h3><p>45° 旋转的点+虚线阵列匀速斜移，经典百搭</p></div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="width:100%;aspect-ratio:4/3;background:#faf8ff;border-radius:8px;overflow:hidden;position:relative;">
        <svg viewBox="0 0 300 225" style="width:100%;height:100%;position:absolute;">
          <defs>
            <pattern id="de2" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect x="8" y="8" width="8" height="8" rx="1.5" fill="rgba(124,58,237,0.08)"/>
              <rect x="20" y="20" width="6" height="6" rx="1" fill="rgba(124,58,237,0.05)"/>
            </pattern>
          </defs>
          <rect width="300" height="225" fill="url(#de2)"/>
        </svg>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50%;aspect-ratio:9/16;background:white;border-radius:10px;box-shadow:0 4px 24px rgba(124,58,237,0.08);display:flex;align-items:center;justify-content:center;font-size:10px;color:#333;border:1px solid rgba(0,0,0,0.04);">练笔小筑</div>
      </div>
    </div>
    <div class="card-body"><h3>B — 斜向方块</h3><p>大小方块沿对角线排列，有层次和呼吸感</p></div>
  </div>

  <div class="card" data-choice="c" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="width:100%;aspect-ratio:4/3;background:#faf8ff;border-radius:8px;overflow:hidden;position:relative;">
        <svg viewBox="0 0 300 225" style="width:100%;height:100%;position:absolute;">
          <defs>
            <pattern id="de3" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <circle cx="8" cy="8" r="2" fill="rgba(124,58,237,0.12)"/>
              <circle cx="20" cy="20" r="3" fill="rgba(124,58,237,0.08)"/>
              <circle cx="32" cy="32" r="1.5" fill="rgba(124,58,237,0.06)"/>
            </pattern>
          </defs>
          <rect width="300" height="225" fill="url(#de3)"/>
        </svg>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50%;aspect-ratio:9/16;background:white;border-radius:10px;box-shadow:0 4px 24px rgba(124,58,237,0.08);display:flex;align-items:center;justify-content:center;font-size:10px;color:#333;border:1px solid rgba(0,0,0,0.04);">练笔小筑</div>
      </div>
    </div>
    <div class="card-body"><h3>C — 斜向圆点</h3><p>渐变大小圆点斜向排列，轻盈活泼</p></div>
  </div>
</div>
